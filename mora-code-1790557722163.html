<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jardín Mágico Interactivo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030208;
            font-family: 'Georgia', serif;
        }

        canvas#canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: pointer;
        }

        .title-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(240, 220, 255, 0.95);
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 3px;
            pointer-events: none;
            transition: opacity 1.5s ease, transform 1.5s ease;
            text-shadow: 0 0 25px rgba(200, 120, 255, 0.8), 0 0 50px rgba(147, 51, 234, 0.5);
            text-align: center;
            z-index: 10;
        }

        .title-overlay.hidden {
            opacity: 0;
            transform: translate(-50%, -60%);
        }

        .audio-control {
            position: absolute;
            bottom: 25px;
            right: 25px;
            background: rgba(20, 10, 35, 0.75);
            border: 1px solid rgba(200, 140, 255, 0.4);
            color: #e9d5ff;
            padding: 12px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.95rem;
            backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.3);
        }

        .audio-control:hover {
            background: rgba(45, 20, 75, 0.9);
            border-color: rgba(233, 213, 255, 0.8);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .title-overlay { font-size: 1.8rem; }
            .audio-control { bottom: 15px; right: 15px; font-size: 0.85rem; padding: 10px 16px; }
        }
    </style>

    <!-- Importación de Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="title" class="title-overlay">Haz Clic para Crear Flores</div>
    <button id="audioBtn" class="audio-control">
        <span id="audioIcon">✨</span> <span id="audioText">Música: OFF</span>
    </button>
    <canvas id="canvas"></canvas>

    <!-- Shader de Vértices -->
    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
        }
    </script>

    <!-- Shader de Fragmentos Procedural Avanzado con Resplandor (Glow) -->
    <script id="fragmentShader" type="x-shader/x-fragment">
        precision highp float;
        
        uniform sampler2D u_texture;
        uniform float u_ratio;
        uniform vec2 u_cursor;
        uniform float u_stop_time;
        uniform vec2 u_stop_randomizer;
        uniform float u_time;
        varying vec2 vUv;

        #define PI 3.14159265359

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
            const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
            vec2 i  = floor(v + dot(v, C.yy) );
            vec2 x0 = v -   i + dot(i, C.xx);
            vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod289(i);
            vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
            vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
            m = m*m; m = m*m;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
            vec3 g;
            g.x  = a0.x  * x0.x  + h.x  * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        float get_flower_shape(vec2 _p, float _petals_number, float _angle, float _outline) {
            float d = length(_p);
            float a = atan(_p.y, _p.x) + _angle;

            float flower_sectoral_shape = abs(sin(a * _petals_number));
            flower_sectoral_shape = pow(flower_sectoral_shape, 0.45);

            float flower_radial_shape = 1.0 - smoothstep(0.0, 0.38, d);
            flower_radial_shape -= 0.12 * sin(8.0 * a);
            flower_radial_shape = max(0.08, flower_radial_shape);
            flower_radial_shape += smoothstep(0.0, 0.03, -_p.y + 0.2 * abs(_p.x));

            float grow_time = step(0.2, u_stop_time) * pow(u_stop_time, 0.35);
            float flower_shape = 1.0 - smoothstep(0.0, flower_sectoral_shape, _outline * flower_radial_shape / max(grow_time, 0.0001));

            flower_shape *= step(0.0001, grow_time) * (1.0 - step(1.0, grow_time));
            return flower_shape;
        }

        float get_stem_shape(vec2 _p, vec2 _uv, float _w, float _angle) {
            _w = max(0.0045, _w);
            float x_offset = _p.y * sin(_angle);
            x_offset *= pow(2.8 * _uv.y, 2.0);
            _p.x -= x_offset;

            float wind = 0.015 * sin(u_time * 2.0 + _uv.y * 5.0);
            _p.x += wind;

            float cursor_noise = 0.45 * snoise(2.5 * _uv * u_stop_randomizer[0]);
            cursor_noise *= pow(dot(_p.y, _p.y), 0.55);
            _p.x += cursor_noise;

            float left = smoothstep(-_w, 0.0, _p.x);
            float right = 1.0 - smoothstep(0.0, _w, _p.x);
            float stem_shape = left * right;

            stem_shape *= step(0.0, _p.y);
            stem_shape *= (1.0 - step(0.18, u_stop_time));
            return stem_shape;
        }

        void main() {
            vec3 base = texture2D(u_texture, vUv).xyz;
            vec2 uv = vUv;
            uv.x *= u_ratio;

            vec2 cursor = vUv - u_cursor.xy;
            cursor.x *= u_ratio;

            // Paletas de colores dinámicas y vibrantes
            vec3 stem_color = vec3(0.15 + u_stop_randomizer[0] * 0.4, 0.75, 0.3);
            
            // Variación de tonos neón (violeta, magenta, cian, rosa)
            vec3 flower_color = vec3(
                0.7 + 0.3 * sin(u_stop_randomizer[0] * PI * 2.0),
                0.2 + 0.3 * cos(u_stop_randomizer[1] * PI * 2.0),
                0.8 + 0.2 * sin(u_stop_randomizer[1] * PI)
            );

            float angle = (u_stop_randomizer[0] - 0.5) * 0.4;

            float stem_shape = get_stem_shape(cursor, uv, 0.004, angle);
            float stem_mask = 1.0 - stem_shape;

            float petals_back_number = 1.0 + floor(u_stop_randomizer[0] * 3.0);
            float angle_offset = -(2.0 * step(0.0, angle) - 1.0) * 0.12 * u_stop_time;
            float flower_back_shape = get_flower_shape(cursor, petals_back_number, angle + angle_offset, 1.4);
            float flower_back_mask = 1.0 - flower_back_shape;

            float petals_front_number = 2.0 + floor(u_stop_randomizer[1] * 3.0);
            float flower_front_shape = get_flower_shape(cursor, petals_front_number, angle, 1.0);
            float flower_front_mask = 1.0 - flower_front_shape;

            // Halo luminoso alrededor de las flores recién creadas
            float distToCenter = length(cursor);
            float glow = smoothstep(0.15, 0.0, distToCenter) * step(0.2, u_stop_time) * (1.0 - step(0.9, u_stop_time));
            vec3 glowColor = flower_color * glow * 0.8;

            vec3 color = base;
            color *= stem_mask;
            color *= flower_back_mask;
            color *= flower_front_mask;
            color += (stem_shape * stem_color);
            color += (flower_back_shape * (flower_color + vec3(0.1, 0.7 * u_stop_time, 0.2)));
            color += (flower_front_shape * flower_color);
            color += glowColor;

            color.r *= 1.0 - (0.4 * flower_back_shape * flower_front_shape);
            color.b *= 1.0 - (0.8 * flower_back_shape * flower_front_shape);

            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <!-- Motor Lógico e Interactividad -->
    <script>
        const canvasEl = document.querySelector("#canvas");
        const titleEl = document.getElementById("title");
        const audioBtn = document.getElementById("audioBtn");
        const audioText = document.getElementById("audioText");
        const audioIcon = document.getElementById("audioIcon");

        let renderer, sceneShader, sceneBasic, camera, clock;
        let renderTargets = [], shaderMaterial, basicMaterial;
        let pointer = { x: 0.5, y: 0.5 };
        let isFirstClick = false;

        // Audio Sintetizado con Web Audio API
        let audioCtx = null, isAudioPlaying = false, masterGain = null;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0, audioCtx.currentTime);

            const filter = audioCtx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(750, audioCtx.currentTime);

            filter.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            // Escala Pentatónica Mística (C#m / E Major)
            const freqs = [138.59, 164.81, 207.65, 246.94, 277.18, 329.63, 415.30, 493.88];
            freqs.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = "sine";
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                lfo.frequency.setValueAtTime(0.03 + i * 0.012, audioCtx.currentTime);
                lfoGain.gain.setValueAtTime(0.05, audioCtx.currentTime);

                lfo.connect(gain.gain);
                lfo.start();

                gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(filter);
                osc.start();
            });
        }

        function toggleAudio() {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (!isAudioPlaying) {
                masterGain.gain.setTargetAtTime(0.2, audioCtx.currentTime, 1);
                isAudioPlaying = true;
                audioText.innerText = "Música: ON";
                audioIcon.innerText = "🔊";
            } else {
                masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
                isAudioPlaying = false;
                audioText.innerText = "Música: OFF";
                audioIcon.innerText = "🔇";
            }
        }

        audioBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleAudio();
        });

        function initScene() {
            renderer = new THREE.WebGLRenderer({
                canvas: canvasEl,
                alpha: true,
                preserveDrawingBuffer: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            sceneShader = new THREE.Scene();
            sceneBasic = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 10);
            clock = new THREE.Clock();

            const renderTargetParams = {
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat,
                type: THREE.FloatType
            };

            renderTargets = [
                new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, renderTargetParams),
                new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, renderTargetParams)
            ];

            shaderMaterial = new THREE.ShaderMaterial({
                vertexShader: document.getElementById("vertexShader").textContent,
                fragmentShader: document.getElementById("fragmentShader").textContent,
                uniforms: {
                    u_texture: { value: null },
                    u_ratio: { value: window.innerWidth / window.innerHeight },
                    u_cursor: { value: new THREE.Vector2(0.5, 0.5) },
                    u_stop_time: { value: 0.0 },
                    u_stop_randomizer: { value: new THREE.Vector2(Math.random(), Math.random()) },
                    u_time: { value: 0.0 }
                }
            });

            basicMaterial = new THREE.MeshBasicMaterial();

            const planeGeo = new THREE.PlaneBufferGeometry(2, 2);
            sceneShader.add(new THREE.Mesh(planeGeo, shaderMaterial));
            sceneBasic.add(new THREE.Mesh(planeGeo, basicMaterial));

            spawnInitialBatch();
        }

        let stopTime = 0.0;
        let isGrowing = false;

        function triggerSpawn(x, y) {
            if (!isFirstClick) {
                isFirstClick = true;
                titleEl.classList.add("hidden");
                if (!isAudioPlaying) toggleAudio();
            }

            pointer.x = x / window.innerWidth;
            pointer.y = 1.0 - (y / window.innerHeight);

            shaderMaterial.uniforms.u_cursor.value.set(pointer.x, pointer.y);
            shaderMaterial.uniforms.u_stop_randomizer.value.set(Math.random(), Math.random());
            stopTime = 0.0;
            isGrowing = true;
        }

        function spawnInitialBatch() {
            const initialCoords = [
                { x: 0.18, y: 0.42 },
                { x: 0.32, y: 0.28 },
                { x: 0.48, y: 0.20 },
                { x: 0.62, y: 0.26 },
                { x: 0.78, y: 0.22 },
                { x: 0.88, y: 0.45 }
            ];

            let index = 0;
            const timer = setInterval(() => {
                if (index >= initialCoords.length) {
                    clearInterval(timer);
                    return;
                }
                const pt = initialCoords[index++];
                triggerSpawn(pt.x * window.innerWidth, pt.y * window.innerHeight);
            }, 320);
        }

        window.addEventListener("click", (e) => {
            triggerSpawn(e.clientX, e.clientY);
        });

        window.addEventListener("touchstart", (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                triggerSpawn(e.touches[i].clientX, e.touches[i].clientY);
            }
        });

        window.addEventListener("resize", () => {
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setSize(w, h);
            shaderMaterial.uniforms.u_ratio.value = w / h;
            renderTargets[0].setSize(w, h);
            renderTargets[1].setSize(w, h);
        });

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            
            shaderMaterial.uniforms.u_time.value = elapsedTime;

            if (isGrowing) {
                stopTime += dt * 0.85;
                if (stopTime > 1.0) {
                    stopTime = 1.0;
                    isGrowing = false;
                }
            }
            shaderMaterial.uniforms.u_stop_time.value = stopTime;

            // Renderizado en Bucle Ping-Pong con Feedback
            shaderMaterial.uniforms.u_texture.value = renderTargets[0].texture;
            renderer.setRenderTarget(renderTargets[1]);
            renderer.render(sceneShader, camera);

            basicMaterial.map = renderTargets[1].texture;
            renderer.setRenderTarget(null);
            renderer.render(sceneBasic, camera);

            // Intercambiar Render Targets
            const temp = renderTargets[0];
            renderTargets[0] = renderTargets[1];
            renderTargets[1] = temp;
        }

        window.addEventListener("DOMContentLoaded", () => {
            initScene();
            animate();
        });
    </script>
</body>
</html>
